name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # The langchain extra only. Installing `laya` would pull PyTorch into every CI job for a
      # backend the benchmark did not promote, and the suite is designed to prove the core
      # works without it.
      - name: Install dependencies
        run: python -m pip install -e ".[dev,langchain]"

      - name: Lint with ruff
        run: ruff check .

      - name: Check formatting with ruff
        run: ruff format --check .

      - name: Type check with mypy
        run: mypy

      - name: Run tests
        run: pytest tests/ -v

      # Proves the architectural claim rather than asserting it: the decision engine must
      # import and screen a call with no classifier backend and no agent framework present.
      - name: Core runs with no backend and no framework installed
        run: |
          python -m pip uninstall -y langchain langchain-core
          python -c "
          from kekkai.domain.policy import ScreeningPolicy, decide
          from kekkai.domain.prefilter import RuleEngine, RuleContext
          from kekkai.adapters.envelope_builder import build_envelope
          env = build_envelope('Bash', {'command': 'rm -rf ~/.ssh'})
          out = RuleEngine.default().evaluate(RuleContext(envelope=env, workspace_root='/proj'))
          d = decide(out.verdicts, None, trivially_safe=out.trivially_safe, policy=ScreeningPolicy.default())
          assert d.decision.value == 'block', d
          print('core blocked a destructive call with no backend and no framework installed')
          "

      - name: Regenerate the threat dataset and confirm it is unchanged
        run: |
          python tools/build_threat_dataset.py
          git diff --exit-code tests/fixtures/threat_dataset.json
